services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/starter
      SPRING_DATASOURCE_USERNAME: starter
      SPRING_DATASOURCE_PASSWORD: starter
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
